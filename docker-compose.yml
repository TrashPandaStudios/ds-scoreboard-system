services:
  scoreboard-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ds-scoreboard-engine
    restart: unless-stopped
    ports:
      - "8089:8080"
    environment:
      - SERVER_PORT=8080
      - DATABASE_PATH=/data/scoreboard.db
      - SERIAL_ENABLED=true
      - SERIAL_PORT=/dev/ttyUSB0
      - SERIAL_BAUD_RATE=9600
      - SERIAL_PULSE_MS=800
      - TZ=UTC
    volumes:
      # Persistent SQLite storage
      - ./data:/data
    # Hardware Buzzer Device Passthrough:
    # Uncomment the devices section when running on Linux host with physical USB-to-Serial relay / buzzer attached
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    # privileged: true
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/arenas" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
